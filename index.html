<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hojun Yu — Industrial Designer</title>
<meta name="description" content="Hojun Yu — industrial designer in Seoul. Product design, 3D engineering, 3D printing and rendering.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="project.css">
</head>
<body class="pp home">
<main id="app"></main>
<script src="data.js"></script>
<script src="kr.js"></script>
<script src="common.js"></script>
<script>
  const S = SITE, KS = (window.KR || {}).site || {}, KRP = window.KR || {};
  const card = (p, i, big) => `
    <a class="pj ${big ? "big" : ""} rv" href="project.html?p=${p.slug}">
      <div class="ph"><img src="img/${p.cover}" alt="${esc(p.title)}" ${i ? 'loading="lazy"' : ""}></div>
      <div class="meta">
        <span class="no">${pad(i + 1)}</span>
        <h3>${esc(p.title)} <em>${esc(p.tagline)}</em></h3>
        <span class="cat">${esc(p.category)} · ${esc(p.year)}<i>View project →</i></span>
      </div>
    </a>`;
  // 배치: 1장 크게, 그다음 2장씩
  const P = PROJECTS;
  let work = card(P[0], 0, true);
  for (let i = 1; i < P.length; i += 2) work += `<div class="pair">${P.slice(i, i + 2).map((p, k) => card(p, i + k)).join("")}</div>`;

  app.innerHTML = `
    <section class="gx">
      <div class="gx-lines" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="gx-top rv">
        <span>(Portfolio)</span><span>2025 — 2026</span><span>${esc(S.role)}<br>Seoul, KR</span><span>Index 01—${pad(P.length)}</span>
      </div>
      <div class="gx-type">
      <h1 class="gx-name rv" aria-label="${esc(cap(S.name))}">
        <span class="l1">Hojun</span>
        <span class="l2"><span class="chip"><img src="img/flos-d2.webp" alt=""></span>Yu<sup>®</sup></span>
      </h1>
      <a class="gx-badge" href="#work" aria-label="See work">
        <svg viewBox="0 0 120 120"><defs><path id="gxc" d="M60 60 m-46 0 a46 46 0 1 1 92 0 a46 46 0 1 1 -92 0"/></defs>
          <text><textPath href="#gxc">LIGHTING · PRODUCT · MOCKUP · RENDERING · </textPath></text></svg><b>↓</b></a>
      </div>
      <div class="gx-foot rv">
        <div><p class="gx-st"><b>Sketch to part,</b> mockup to image.</p><p class="st-kr">${esc(KS.hero || "")}</p></div>
        <div class="side">
          <p>${esc(S.statement)}</p>
          <ol class="gx-idx">${P.map((p, i) => `<li><a href="project.html?p=${p.slug}"><span>${pad(i + 1)}</span><b>${esc(p.title)}</b><em>${esc(p.category)}</em></a></li>`).join("")}</ol>
        </div>
      </div>
    </section>
    <div class="gx-mq" aria-hidden="true"><div>${Array(2).fill(["Product Design", "3D Engineering", "Mockup", "Rendering", "AI-assisted Design", "Lighting"].map(t => `<span>${t}</span><i>✳</i>`).join("")).join("")}</div></div>

    <section class="wrap work2" id="work">
      <h2 class="lbl rv"><b>Selected work</b><span>${pad(P.length)}</span></h2>
      ${work}
    </section>

    <section class="wrap say rv" id="info">
      <h2>One designer, <span>the whole process.</span></h2>
      <div class="cols"><div>${S.about.map(t => `<p>${esc(t)}</p>`).join("")}</div><div>${(KS.about || []).map(t => `<p class="kr">${esc(t)}</p>`).join("")}</div></div>
    </section>

    <div class="chaps home-chaps">
      <section class="chap rv">
        <header><span class="no">01</span><div><h3>Capabilities <i>${esc(KS.capT || "")}</i></h3><span class="sub">What I do</span><span class="sk">${esc(KS.capSub || "")}</span></div></header>
        <ol class="pts2">${S.capabilities.map((c, i) => { const [kt, kx] = (KS.caps || [])[i] || []; return `<li><span class="n">${i + 1}.</span><h4>${esc(c.t)}</h4>${kt ? `<span class="hk">${esc(kt)}</span>` : ""}<p>${esc(c.d)}</p>${kx ? `<p class="k">${esc(kx)}</p>` : ""}</li>`; }).join("")}</ol>
      </section>
      <section class="chap rv">
        <header><span class="no">02</span><div><h3>Tools <i>${esc(KS.toolT || "")}</i></h3><span class="sub">Daily kit</span><span class="sk">${esc(KS.toolSub || "")}</span></div></header>
        <ul class="chips">${S.skills.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      </section>
    </div>

    <section class="wrap contact2 rv">
      <span class="lab">Contact <i>${esc(KS.contactLab || "")}</i></span>
      <h2>Let's make <span>the next product.</span></h2>
      <p class="h-kr">${esc(KS.contact || "")}</p>
      <a class="mail" href="mailto:${esc(S.email)}">${esc(S.email)} →</a>
    </section>

    <footer class="ft"><span>© ${new Date().getFullYear()} ${esc(cap(S.name))}</span><a class="ul" href="#">Back to top</a></footer>`;
  header();
  reveal(); fadeImgs();
</script>
</body>
</html>
