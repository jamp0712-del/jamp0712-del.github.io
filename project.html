<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Hojun Yu</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="project.css">
</head>
<body class="pp">
<main id="app"></main>
<script src="data.js"></script>
<script src="details.js"></script>
<script src="drawings.js"></script>
<script src="vs.js"></script>
<script src="common.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("p");
  const idx = Math.max(0, PROJECTS.findIndex(p => p.slug === slug));
  const p = PROJECTS[idx], nx = PROJECTS[(idx + 1) % PROJECTS.length];
  const d = (window.DETAILS || {})[p.slug] || null;
  const v = (window.VS || {})[p.slug] || null;
  document.title = `${p.title} — ${cap(SITE.name)}`;

  const img = (f, cls = "") => `<div class="ph ${cls}"><img src="img/${f}" alt="${esc(p.title)}" loading="lazy"></div>`;
  const N = PROJECTS.length;
  // 섹션 라벨 줄 (메인 히어로의 인덱스 라벨과 같은 형식)
  const lab = (...xs) => `<div class="lrow rv">${xs.map(x => `<span>${x}</span>`).join("")}</div>`;
  // 대형 타이포: 마지막 단어 앞에 이미지 칩
  const bigType = (q, tag = "h1") => {
    const w = q.title.split(" "), last = w.pop();
    return `<${tag} class="gx-name fit" aria-label="${esc(q.title)}">${w.length ? `<span class="l1">${esc(w.join(" "))}</span>` : ""}<span class="l2"><span class="chip"><img src="img/${q.chip || q.cover}" alt=""></span>${esc(last)}</span></${tag}>`;
  };
  const twoTone = t => { const w = t.split(" "), h = Math.ceil(w.length / 2); return `<b>${esc(w.slice(0, h).join(" "))}</b> ${esc(w.slice(h).join(" "))}`; };
  const marquee = words => `<div class="gx-mq" aria-hidden="true"><div>${Array(2).fill(words.map(t => `<span>${esc(t)}</span><i>✳</i>`).join("")).join("")}</div></div>`;

  let ch = 0; const toc = [];
  const chap = (title, sub, inner, cls = "") => {
    ch++; toc.push([`c${ch}`, title]);
    return `
    <section class="chap ${cls} rv" id="c${ch}">
      <header><span class="no">${pad(ch)}</span><div><h3>${esc(title)}</h3>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</div><span class="tick">(${pad(ch)}/{{CH}})</span></header>
      ${inner}
    </section>`;
  };

  // 갤러리: 디렉션 이미지는 중복 제거, 한 줄 1장(꽉) 또는 2장(반반)
  const gal = p.gallery.map(r => r.filter(f => !(d && d.dir && d.dir.img === f))).filter(r => r.length);
  const stack = rows => rows.map(r => `<div class="st ${r.length > 1 ? "two" : ""}">${r.map(f => img(f)).join("")}</div>`).join("");
  const lead = gal.slice(0, 1), more = gal.slice(1);

  // 번호 챕터들
  let chaps = "";
  if (d) {
    chaps += chap("Process", "From brief to final image", `<ol class="proc2">${d.process.map(([s, x, t], i) => `
      <li><span class="n">${String.fromCharCode(65 + i)}</span><b>${esc(s)}</b><p>${esc(x)}</p><span class="tool">${esc(t)}</span></li>`).join("")}</ol>`);
    chaps += chap("Design points", "What the form has to do", `<ol class="pts2">${d.points.map(([t, x], i) => `
      <li><span class="n">${i + 1}.</span><h4>${esc(t)}</h4><p>${esc(x)}</p></li>`).join("")}</ol>`);
    chaps += chap("Technical drawings", `${d.dwg} · Scale ${d.scale} · mm`, `<div class="dw2"><div class="figs">${d.figs.map(([k, name, span], i) => `
      <figure style="--s:${span}">${drawing(p.slug, k)}<figcaption><b>Fig. ${pad(i + 1)}</b>${esc(name)}</figcaption></figure>`).join("")}</div></div>`);
    if (d.real) {
      let rn = 0;
      const shots = d.real.rows.flatMap(([, fs]) => fs);
      const cls = d.real.studio ? "studio" : `n${Math.min(shots.length, 4)}`;
      chaps += chap(d.real.chap || "Mockup & test", d.real.krk || "", `<p class="intro2">${esc(d.real.lead)}</p><div class="mock ${cls}">${shots.map(([f, en, kr]) => `
        <figure>${img(f)}<figcaption><b>${d.real.studio ? "" : `${++rn}. `}${esc(en)}</b>${esc(kr || "")}</figcaption></figure>`).join("")}</div>`, "dark");
    }
    chaps += chap(d.cmfTitle || "Color, material, finish", "", `<ul class="cmf2">${d.cmf.map(([n, x, bg]) => `
      <li><div class="sw" style="background:${bg}"></div><b>${esc(n)}</b><span>${esc(x)}</span></li>`).join("")}</ul>`);
    chaps += chap("Assembly", "Parts and finishes", `${d.asm ? `<div class="asm2">${drawing(p.slug, d.asm)}</div>` : ""}<ol class="parts2">${d.parts.map(([n, m, sz, q], i) => `
      <li><span class="n">${i + 1}</span><b>${esc(n)}${q > 1 ? ` <small>× ${q}</small>` : ""}</b><em>${esc(m)}</em><i>${sz ? esc(sz) : ""}</i></li>`).join("")}</ol>`);
    chaps += chap("Specifications", "", `<dl class="spec2">${d.specs.map(([k, x]) => `<div><dt>${esc(k)}</dt><dd>${esc(x)}</dd></div>`).join("")}</dl>`);
  }
  chaps = chaps.replace(/\{\{CH\}\}/g, pad(ch));

  // 1. 그래픽 히어로 (메인과 같은 구성)
  const contents = [["story", "Overview"], ...(v ? [["vs", "Problem → idea"]] : []), ...(d && d.dir ? [["dir", "Direction"]] : []), ["gal", "Images"], ...toc];
  const title = `
    <section class="gx gx-p">
      <div class="gx-lines" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="gx-top rv">
        <span>(Project ${pad(idx + 1)}/${pad(N)})</span><span>${esc(p.category)}<br>${esc(p.kr)}</span><span>${esc(p.year)}<br>${esc(p.client)}</span><span>${esc(p.role)}</span>
      </div>
      <div class="gx-type rv">
        ${bigType(p)}
        <a class="gx-badge" href="#story" aria-label="Read the project">
          <svg viewBox="0 0 120 120"><defs><path id="gxc" d="M60 60 m-46 0 a46 46 0 1 1 92 0 a46 46 0 1 1 -92 0"/></defs>
            <text><textPath href="#gxc">${esc(`${p.category} · ${p.year} · ${pad(idx + 1)}/${pad(N)} · `.toUpperCase())}</textPath></text></svg><b>↓</b></a>
      </div>
      <div class="gx-foot rv">
        <p class="gx-st">${twoTone(p.tagline)}</p>
        <div class="side">
          <p>${esc(p.summary)}</p>
          <ol class="gx-idx">${contents.map(([id, t], i) => `<li><a href="#${id}"><span>${pad(i + 1)}</span>${esc(t)}<em>↓</em></a></li>`).join("")}</ol>
        </div>
      </div>
    </section>`;

  // 2. 히어로 이미지 + 키워드 마키
  const hero = `<section class="wrap flush">${img(p.cover, "hero")}${stack(lead)}</section>${marquee([p.category, ...(d ? d.points.map(x => x[0]) : [p.tagline])])}`;

  // 3. 두 톤 헤드라인 + 개요
  const headline = v ? v.head : (d && d.q) || [p.tagline, ""];
  const story = `
    <section class="wrap say" id="story">
      ${lab("(Overview)", esc(p.title), esc(p.year), "")}
      <h2 class="rv">${esc(headline[0])} <span>${esc(headline[1] || "")}</span></h2>
      <div class="cols rv">${d ? `<p>${esc(d.brief)}</p>` : ""}${d && d.kr ? `<p class="kr">${esc(d.kr)}</p>` : ""}</div>
    </section>`;

  // 4. 기존 → 새 방식 비교
  const compare = !v ? "" : `
    <section class="wrap" id="vs">
      ${lab("(Problem → idea)", esc(v.from), "→", esc(v.to))}
      <div class="vs rv">
        <div class="pan"><span class="tg">Before</span><b>${esc(v.a[0])}</b><span>${esc(v.a[1])}</span>${v.svg[0]}</div>
        <div class="arr" aria-hidden="true">→</div>
        <div class="pan on"><span class="tg">After</span><b>${esc(v.b[0])}</b><span>${esc(v.b[1])}</span>${v.svg[1]}</div>
      </div>
    </section>`;

  // 5. 디렉션
  const dir = !(d && d.dir) ? "" : `
    <section class="wrap" id="dir">
      ${lab("(Direction)", esc(d.dir.label), esc(d.dir.kr), "")}
      <div class="dir2 rv">
        <div class="tx"><h3>${esc(d.dir.t)}</h3><span class="krs">${esc(d.dir.kr)}</span><p>${esc(d.approach)}</p></div>
        ${img(d.dir.img)}
      </div>
    </section>`;

  // 6. 갤러리 나머지 + 설명 문단
  const notes = p.body.map(t => `<p class="note2 rv"><i>✳</i>${esc(t)}</p>`);
  const gallery = `<section class="wrap" id="gal">${lab("(Images)", `${pad(gal.length)} views`, "", "")}</section><section class="wrap flush">${more.map((r, i) => stack([r]) + (i % 2 === 1 && notes.length ? notes.shift() : "")).join("")}</section>${notes.length ? `<section class="wrap">${notes.join("")}</section>` : ""}`;

  // 7. 디테일 클로즈업
  const close = !(v && v.close.length) ? "" : `<section class="wrap flush close">${v.close.map(f => img(f)).join("")}</section>`;

  // 8. 다음 프로젝트 (대형 타이포)
  const next = `
    <a class="gx nx-g" href="project.html?p=${nx.slug}">
      <div class="gx-top"><span>(Next project)</span><span>${pad((idx + 1) % N + 1)}/${pad(N)}</span><span>${esc(nx.category)}</span><span>View project →</span></div>
      ${bigType(nx, "div")}
    </a>`;

  app.innerHTML = `${title}${hero}${story}${compare}${dir}${gallery}${close}<div class="chaps">${chaps}</div>${next}
    <footer class="ft"><span>© ${new Date().getFullYear()} ${esc(cap(SITE.name))}</span><a class="ul" href="index.html">All work</a></footer>`;
  fitType();
  header();
  reveal(); fadeImgs();

  // lightbox
  const shots = [...document.querySelectorAll("#app .ph:not(.no-lb) img")].filter(im => !im.closest(".nx-g, .gx"));
  document.body.insertAdjacentHTML("beforeend", `
    <div class="lb" role="dialog" aria-modal="true" aria-label="Image viewer"><img alt="">
      <div class="bar"><span class="mono ct"></span><div class="nav2"><button class="pv">Prev</button><button class="nx">Next</button><button class="x">Close</button></div></div>
    </div>`);
  const lb = document.querySelector(".lb"), lbImg = lb.querySelector("img"), ct = lb.querySelector(".ct");
  let at = 0;
  const open = i => { at = (i + shots.length) % shots.length; lbImg.src = shots[at].src; ct.textContent = `${pad(at + 1)} / ${pad(shots.length)}`; lb.classList.add("on"); document.body.style.overflow = "hidden"; };
  const closeLb = () => { lb.classList.remove("on"); document.body.style.overflow = ""; };
  shots.forEach((im, i) => im.closest(".ph").addEventListener("click", () => open(i)));
  lb.querySelector(".x").onclick = closeLb;
  lb.querySelector(".pv").onclick = e => { e.stopPropagation(); open(at - 1); };
  lb.querySelector(".nx").onclick = e => { e.stopPropagation(); open(at + 1); };
  lb.addEventListener("click", e => { if (e.target === lb || e.target === lbImg) closeLb(); });
  addEventListener("keydown", e => {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") closeLb(); if (e.key === "ArrowLeft") open(at - 1); if (e.key === "ArrowRight") open(at + 1);
  });
</script>
</body>
</html>
