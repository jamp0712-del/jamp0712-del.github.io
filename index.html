<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hojun Yu — Industrial Designer</title>
<meta name="description" content="Hojun Yu — industrial designer in Seoul. Product design, 3D engineering, 3D printing and rendering.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="project.css">
</head>
<body class="pp home">
<main id="app"></main>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const S = SITE;
  const card = (p, i, big) => `
    <a class="pj ${big ? "big" : ""} rv" href="project.html?p=${p.slug}">
      <div class="ph"><img src="img/${p.cover}" alt="${esc(p.title)}" ${i ? 'loading="lazy"' : ""}></div>
      <div class="meta">
        <span class="no">${pad(i + 1)}</span>
        <h3>${esc(p.title)} <em>${esc(p.tagline)}</em></h3>
        <span class="cat">${esc(p.category)} · ${esc(p.year)}<i>View project →</i></span>
      </div>
    </a>`;
  // 배치: 1장 크게, 그다음 2장씩
  const P = PROJECTS;
  let work = card(P[0], 0, true);
  for (let i = 1; i < P.length; i += 2) work += `<div class="pair">${P.slice(i, i + 2).map((p, k) => card(p, i + k)).join("")}</div>`;

  app.innerHTML = `
    <section class="ttl hero-t">
      <span class="kick rv">${esc(S.role)} — Seoul</span>
      <h1 class="rv">${esc(cap(S.name))}<em>Sketch to part, mockup to image.</em></h1>
      <p class="rv">${esc(S.statement)}</p>
      <p class="kr rv">${esc(S.statementKr)}</p>
      <dl class="rv">
        <div><dt>Focus</dt><dd>Lighting · Product</dd></div>
        <div><dt>Projects</dt><dd>${P.length} selected, ${P[0].year}</dd></div>
        <div><dt>Tools</dt><dd>Rhino · KeyShot · AI</dd></div>
        <div><dt>Contact</dt><dd><a class="ul" href="mailto:${esc(S.email)}">${esc(S.email)}</a></dd></div>
      </dl>
    </section>

    <section class="wrap work2" id="work">
      <h2 class="lbl rv">Selected work <span>${pad(P.length)}</span></h2>
      ${work}
    </section>

    <section class="wrap say rv" id="info">
      <h2>One designer, <span>the whole process.</span></h2>
      ${S.about.map(t => `<p>${esc(t)}</p>`).join("")}
    </section>

    <div class="chaps home-chaps">
      <section class="chap rv">
        <header><span class="no">01</span><h3>Capabilities</h3><span class="sub">What I do</span></header>
        <ol class="pts2">${S.capabilities.map((c, i) => `<li><span class="n">${i + 1}.</span><h4>${esc(c.t)}</h4><p>${esc(c.d)}</p></li>`).join("")}</ol>
      </section>
      <section class="chap rv">
        <header><span class="no">02</span><h3>Tools</h3><span class="sub">Daily kit</span></header>
        <ul class="chips">${S.skills.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      </section>
    </div>

    <section class="wrap contact2 rv">
      <span class="lab">Contact</span>
      <h2>Let's build <span>the next light.</span></h2>
      <a class="mail" href="mailto:${esc(S.email)}">${esc(S.email)} →</a>
    </section>

    <footer class="ft"><span>© ${new Date().getFullYear()} ${esc(cap(S.name))}</span><a class="ul" href="#">Back to top</a></footer>`;
  header();
  reveal(); fadeImgs();
</script>
</body>
</html>
