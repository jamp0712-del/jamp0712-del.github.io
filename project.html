<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Hojun Yu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="details.js"></script>
<script src="drawings.js"></script>
<script src="common.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("p");
  const idx = Math.max(0, PROJECTS.findIndex(p => p.slug === slug));
  const p = PROJECTS[idx], nx = PROJECTS[(idx + 1) % PROJECTS.length];
  const dark = p.theme === "dark";
  document.title = `${p.title} — ${cap(SITE.name)}`;

  const d = (window.DETAILS || {})[p.slug];
  const row = (label, inner) => `<div class="row12 rv"><span class="mono">${label}</span>${inner}</div>`;
  const sec = (inner, cls = "") => `<section class="sec ${cls}">${inner}</section>`;

  // 크레딧 띠 (JUMAK식)
  const TOOLS = { "Product Design": "Sketch · Rhino", "Design": "Sketch · Rhino", "Concept": "Sketch · Midjourney", "3D Modeling": "Rhino", "Engineering": "Rhino", "Mockup": "3D print · Assembly", "Rendering": "KeyShot", "Lighting Planning": "Rhino · KeyShot", "Visualization": "KeyShot" };
  const credits = `<section class="credits rv">${p.role.split("·").map(r => r.trim()).map(r => `
    <div><span class="mono">${esc(r)}</span><b>${esc(cap(SITE.name))}</b><i>${esc(TOOLS[r] || "")}</i></div>`).join("")}
    <div><span class="mono">${esc(p.client)}</span><b>${esc(p.year)}</b><i>${esc(p.category)}</i></div></section>`;

  // 개요: 영문 + 한글
  const story = !d ? "" : `<section class="ov rv"><span class="mono">Overview</span>
    <p class="en">${esc(d.brief)}</p>${d.kr ? `<p class="kr">${esc(d.kr)}</p>` : ""}</section>`;

  // 큰 질문 문장
  const quest = !(d && d.q) ? "" : `<section class="quest rv"><h2>${d.q.map(esc).join("<br>")}</h2>${d.qkr ? `<p>${esc(d.qkr)}</p>` : ""}</section>`;

  // 디렉션: 글 왼쪽, 이미지 오른쪽
  const dir = !(d && d.dir) ? "" : `<section class="dirx rv">
    <div class="tx"><span class="mono">${esc(d.dir.label)}</span><h3>${esc(d.dir.t)}</h3><span class="krs">${esc(d.dir.kr)}</span><p>${esc(d.approach)}</p></div>
    <div class="ph"><img src="img/${d.dir.img}" alt="${esc(d.dir.t)}" loading="lazy"></div></section>`;

  // 디자인 포인트
  const points = !d ? "" : sec(row("Design points", `<ol class="c2 pts">${d.points.map(([t, x], i) => `
    <li><span class="mono">${pad(i + 1)}</span><h3>${esc(t)}</h3><p>${esc(x)}</p></li>`).join("")}</ol>`));

  // 도면 시트
  const sheet = !d ? "" : `
    </section>${points}
    <section class="dw rv"><div class="sheet">
      <div class="head"><span class="mono">Technical drawings</span><span class="mono">Dimensions in mm</span></div>
      <div class="figs">${d.figs.map(([k, name, span], i) => `
        <figure style="--s:${span}">${drawing(p.slug, k)}
          <figcaption class="mono"><b>Fig. ${pad(i + 1)}</b>${esc(name)}</figcaption></figure>`).join("")}</div>
      <div class="tb">
        <div class="mono">Designer<span>${esc(cap(SITE.name))}</span></div>
        <div class="mono">Project<span>${esc(p.title)}</span></div>
        <div class="mono">Dwg no.<span>${esc(d.dwg)}</span></div>
        <div class="mono">Scale<span>${esc(d.scale)}</span></div>
        <div class="mono">Unit<span>mm</span></div>
        <div class="mono">Date<span>${esc(p.year)}</span></div>
      </div>
    </div></section>
    <section class="pg">`;

  // 갤러리 사이사이에 설명 문단, 첫 문단 뒤에 디자인 포인트 + 도면
  let bi = 0, placed = false;
  const gal = p.gallery.map(r => r.filter(f => !(d && d.dir && d.dir.img === f))).filter(r => r.length);
  const rows = gal.map((r, i) => {
    let html = `<div class="row ${r.length > 1 ? "two" : "one"} rv">${r.map(f => `<div class="ph"><img src="img/${f}" alt="${esc(p.title)}" loading="lazy"></div>`).join("")}</div>`;
    if ((i === 1 || (i > 1 && (i - 1) % 3 === 0)) && bi < p.body.length && i < gal.length - 1) {
      html += `<div class="note rv"><p>${esc(p.body[bi++])}</p></div>`;
      if (!placed) { html += sheet; placed = true; }
    }
    return html;
  }).join("");
  const rest = p.body.slice(bi).map(t => `<div class="note rv"><p>${esc(t)}</p></div>`).join("") + (placed ? "" : sheet);

  // CMF · 프로세스 · 분해도 · 스펙
  const cmf = !d ? "" : sec(row(d.cmfTitle || "Color, material, finish", `<ul class="c2 cmf">${d.cmf.map(([n, x, bg]) => `
    <li><div class="sw" style="background:${bg}"></div><b>${esc(n)}</b><span>${esc(x)}</span></li>`).join("")}</ul>`));
  const proc = !d ? "" : sec(row("Process", `<ol class="c2 proc" style="--n:${d.process.length > 4 ? 3 : d.process.length}">${d.process.map(([s, x, t], i) => `
    <li><span class="mono">${pad(i + 1)}</span><b>${esc(s)}</b><p>${esc(x)}</p><span class="mono tool">${esc(t)}</span></li>`).join("")}</ol>`));
  const parts = !d ? "" : row("Components", `<ol class="c2 parts">${d.parts.map(([n, m, sz, q]) => `
    <li><span>${esc(n)}${q > 1 ? ` <small>× ${q}</small>` : ""}</span><em>${esc(m)}</em><i>${sz ? esc(sz) : ""}</i></li>`).join("")}</ol>`);
  const asm = !d ? "" : sec((d.asm ? row("Assembly", `<figure class="c2 asmfig">${drawing(p.slug, d.asm)}<figcaption class="mono"><b>Exploded view</b>Numbers match the component list</figcaption></figure>`) : "") + parts);
  // 실물 사진 (흑백 아카이브)
  let rn = 0;
  const real = !(d && d.real) ? "" : `
    <section class="real">
      <div class="rh rv"><span class="mono">${esc(d.real.kicker)}<br>${esc(d.real.krk || "")}</span><h2>${esc(d.real.title)}</h2><p>${esc(d.real.lead)}</p></div>
      ${d.real.rows.map(([t, fs]) => `<div class="rr ${t} rv">${fs.map(([f, en, kr]) => `
        <figure><div class="ph"><img src="img/${f}" alt="${esc(en)}" loading="lazy"></div>
          <figcaption><span class="n">${++rn}</span><span class="t">${esc(en)}<small>${esc(kr || "")}</small></span></figcaption></figure>`).join("")}</div>`).join("")}
    </section>`;
  const spec = !d ? "" : sec(row("Specifications", `<dl class="c specs">${d.specs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`));

  app.innerHTML = `
    <section class="p-hero">
      <img src="img/${p.cover}" alt="${esc(p.title)}">
      <div class="mark ${dark ? "light" : ""}">${esc(p.title)}<i></i>${esc(p.category)}</div>
      <span class="idx mono ${dark ? "light" : ""}">${pad(idx + 1)} / ${pad(PROJECTS.length)}</span>
    </section>

    <section class="p-info">
      <h1 class="rv">${esc(p.title)}<small>${esc(p.kr)}</small></h1>
      <p class="sum rv">${esc(p.summary)}</p>

    </section>

    ${credits}${story}${quest}${dir}
    <section class="pg">${rows}${rest}</section>
    ${cmf}${proc}${real}${asm}${spec}

    <a class="nextp rv" href="project.html?p=${nx.slug}">
      <span class="mono">Next project</span>
      <div class="t">${esc(nx.title)}<small>${esc(nx.category)} →</small></div>
      <div class="th"><img src="img/${nx.cover}" alt="" loading="lazy"></div>
    </a>
    <footer class="ft"><span>© ${new Date().getFullYear()} ${esc(cap(SITE.name))}</span><a class="ul" href="index.html">All work</a></footer>`;
  header({ darkHero: dark });
  reveal(); fadeImgs();

  // lightbox
  const shots = [...document.querySelectorAll(".pg .ph img, .real .ph img")];
  document.body.insertAdjacentHTML("beforeend", `
    <div class="lb" role="dialog" aria-modal="true" aria-label="Image viewer"><img alt="">
      <div class="bar"><span class="mono ct"></span><div class="nav2"><button class="pv">Prev</button><button class="nx">Next</button><button class="x">Close</button></div></div>
    </div>`);
  const lb = document.querySelector(".lb"), lbImg = lb.querySelector("img"), ct = lb.querySelector(".ct");
  let at = 0;
  const open = i => { at = (i + shots.length) % shots.length; lbImg.src = shots[at].src; ct.textContent = `${pad(at + 1)} / ${pad(shots.length)}`; lb.classList.add("on"); document.body.style.overflow = "hidden"; };
  const close = () => { lb.classList.remove("on"); document.body.style.overflow = ""; };
  shots.forEach((im, i) => im.closest(".ph").addEventListener("click", () => open(i)));
  lb.querySelector(".x").onclick = close;
  lb.querySelector(".pv").onclick = e => { e.stopPropagation(); open(at - 1); };
  lb.querySelector(".nx").onclick = e => { e.stopPropagation(); open(at + 1); };
  lb.addEventListener("click", e => { if (e.target === lb || e.target === lbImg) close(); });
  addEventListener("keydown", e => {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") close(); if (e.key === "ArrowLeft") open(at - 1); if (e.key === "ArrowRight") open(at + 1);
  });
</script>
</body>
</html>
